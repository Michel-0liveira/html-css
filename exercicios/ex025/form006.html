<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formularios</title>
</head>

<body>
    <h1>Range,color e file</h1>
    <form action="#" method="post" autocomplete="on">
        <fieldset>
            <legend>Range,color e file</legend>
            <div>
                <label for="icor">Cor:</label>
                <input type="color" name="cor" id="icor" value="#00ff00">
            </div>
            <br>
            <div>
                <label for="inivel">Nivel de satisfação:</label>
                <input type="range" name="nivel" id="inivel" min="1" max="10" value="5">
            </div>
            <br>
            <div>
                <label for="ifile">Escolha o arquivo:</label><br>
                <input type="file" name="file" id="ifile">
            </div>
        </fieldset>
        <br>
        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>
    </form>
</body>

</html>
