<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formularios</title>
</head>
<body>
    <form action="" autocomplete="on" method="get">
        <h1>
            Checkbox e Radios
        </h1>
        <fieldset>
            <legend>Sports</legend>
            <div>
                <input type="radio" name="sports" id="isurf" value="surf">
                <label for="isurf">Surf</label>
                <input type="radio" name="sports" id="ibast" value="Futebol">
                <label for="ibast">Futebol</label>
                <input type="radio" name="sports" id="ibasq" value="basquete">
                <label for="ibasq">Basquete</label>
            </div>
        </fieldset>
        <fieldset>
            <legend>Comidas que você gosta?</legend>
            <div>
                <input type="checkbox" name="churrasco" id="ichurras">
                <label for="ichurras">churrasco</label> <br>
                <input type="checkbox" name="pastel" id="ipastel">
                <label for="ipastel">pastel</label><br>
                <input type="checkbox" name="bolo-de-prestigio" id="ibolo">
                <label for="ibolo">bolo de prestigio</label>
            </div>
        </fieldset>
        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>
    </form>
    
</body>
</html>
