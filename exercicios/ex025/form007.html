<!DOCTYPE html>
<html lang="PT-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formularios</title>
</head>

<body>
    <h1>Select, Datalist e Textarea</h1>
    <form action="#" method="get" autocomplete="on">
        <div>
            <label for="iest">Estados</label>
            <select name="estados" id="iest">
                <optgrop>
                    <option value="MG">Minas Gerais</option>
                    <option value="SP">Sao Paulo</option>
                    <option value="RJ">Rio de Janeiro</option>
                </optgrop>
            </select>
        </div>

        <div>
            <label for="lst-prof">profissoes</label>
            <input type="text" name="lista-de-profissoes" id="lst-prof" list="list-profissoers">
            <datalist id="list-profissoers">
                <option value="ADM">Administrador</option>
                <option value="PROF">Profrssor</option>
                <option value="DEV">Desenvolvedor</option>
            </datalist>
        </div>

        <div>
            <label for="icoment">Comentários:</label><br>
            <textarea name="coment" id="icoment" cols="50" rows="10"></textarea>
        </div>
        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>
    </form>
</body>

</html>
