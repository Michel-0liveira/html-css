<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>

<body>
    <h1>telefones e emails</h1>
    <form action="cadrasto.php" autocomplete="on">
        <div>
            <label for="itel">telefone</label>
            <input type="tel" name="tel" id="itel" maxlength="14" placeholder="(XX)XXXXX-XXXX">
        </div>
        <div>
            <label for="iemail">E-mail</label>
            <input type="email" name="email" id="iemail" placeholder="Ex:joao765@gmail.com">
        </div>
    </form>
</body>
