<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formularios 02</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }

        body {

            height: 96vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form_login {
            width: 300px;
            height: 400px;
            margin: auto;
            background-image: linear-gradient(75deg, yellow, orange, red);
            box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.452);
            border-radius: 20px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>
    <div class="form_login">
        <h1>login</h1>
        <form autocomplete="off" action="cadrasto.php" method="post">
            <p>
                <label for="iusuario">usuario:</label>
                <input type="text" name="usuario" id="iusuario" autocomplete="username" required minlength="4" maxlength="12" size="8" placeholder="Seu nome...">
            </p>
            <p>
                <label for="isenha">Senha:</label>
                <input type="password" name="senha" id="isenha" autocomplete="current-password" required minlength="6" maxlength="10" size="8" placeholder="senha...">
            </p>
            <p>
                <input type="submit" value="Entrar">
                <input type="reset" value="Limpar">
            </p>
        </form>
    </div>
</body>

</html>
