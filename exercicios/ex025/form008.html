<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios output</title>
</head>

<body>
    <!-- OUTPUT = TAG
     ONIPUT = ATRIBUTO QUE PASSA FUNÇÕES JS, QUE CRIA A LOGICA PARA OCORRER DETERNINADA AÇAO-->
    <h1>Digite dois numeros para realizar uma soma!</h1>
    <form action="#" method="get" autocomplete="on">
        <div>
            <label for="in1">Primeiro Numero</label> <br>
            <input type="number" name="numero-01" id="in1" min="1" placeholder="Selecione um numero"
                oninput="isoma.innerHTML=Number(in1.value)+Number(in2.value)">
        </div>
        <div>
            <label for="in2">Segundo Numero</label> <br>
            <input type="number" name="numero-02" id="in2" min="1" placeholder="Selecione um numero"  oninput="isoma.innerHTML=Number(in1.value)+Number(in2.value)">
        </div>

        <div>
            <label for="isoma">Soma:</label>
            <output id="isoma">0</output>
        </div>

        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>
    </form>
</body>

</html>
