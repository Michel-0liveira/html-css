<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propriedades dos itens</title>

    <style>
        div.conteiner {
            display: grid;
            grid-template: repeat(3, 100px) /
                repeat(4, 1fr);
            gap: 5px;
            grid-auto-rows: 100px;

            max-width: 1000px;
            margin: auto;
            border: 2px solid orange;
            border-radius: 5px;
            padding: 10px;
        }

        div.caixa01,
        div.caixa02,
        div.caixa03,
        div.caixa04 {
            border: 1px solid black;
            padding: 5px;
            border-radius: 5px;
        }

        .caixa01 {
            background-color: aqua;

            grid-row: 1/2;
            grid-column: 1/5;
        }

        .caixa02 {
            background-color: blueviolet;
            
            grid-area: 2/1/4/3;
        }

        .caixa03 {
            background-color: chartreuse;

            grid-row-start: 2;
            grid-row-end: 4;

            grid-column-start: 3;
            grid-column-end: 5;
        }
    </style>
</head>

<body>
    <div class="conteiner">
        <div class="caixa01">Caixa 01</div>
        <div class="caixa02">Caixa 02</div>
        <div class="caixa03">Caixa 03</div>
    </div>
</body>

</html>
