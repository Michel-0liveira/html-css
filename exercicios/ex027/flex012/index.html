<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex box</title>
    <style>
        div.conteiner {
            background-color: brown;

            display: flex;
        }

        div.itens {
            background-color: aqua;
            text-align: center;
            border: 1px solid black;
            padding: 10px 0;
        }

        div#i1 {
            flex: 0 0 150px;
        }
        div#i2 {
            flex: 0 1 150px;
        }
        div#i3 {
            flex: 0 0 150px;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="itens" id="i1">A</div>
        <div class="itens" id="i2">B</div>
        <div class="itens" id="i3">C</div>
    </div>
</body>
</html>
