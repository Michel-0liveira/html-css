<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex box</title>
    <style>
        div.conteiner {
            background-color: brown;
            height: 300px;
            display: flex;
            align-items: flex-start;
            gap: 5PX;

        }

        div.itens {
            background-color: aqua;
            text-align: center;
            padding: 15px 30px;
            border: 1px solid black;
        }

        div#i1 {
            align-self: center;
        }

        div#i2 {
            align-self: stretch;
        }

        div#i3 {
            align-self: flex-end;
        }

        div#i4 {
            align-self: auto;
        }

        div#i5 {
            align-self: center;
        }

        div#i6 {
            align-self: stretch;
        }
    </style>
</head>

<body>
    <div class="conteiner">
        <div class="itens" id="i1">A</div>
        <div class="itens" id="i2">B</div>
        <div class="itens" id="i3">C</div>
        <div class="itens" id="i4">D</div>
        <div class="itens" id="i5">E</div>
        <div class="itens" id="i6">F</div>
    </div>
</body>

</html>
