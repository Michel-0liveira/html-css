<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex box</title>
    <style>
        div.conteiner {
            background-color: brown;

            display: flex;
            flex-flow: row nowrap;
        }

        div.itens {
            background-color: aqua;
            text-align: center;
            border: 1px solid black;
            flex-basis: 350px;
            flex-shrink: 1;
            flex-grow: 0;

        }
    </style>
</head>

<body>
    <div class="conteiner">
        <div class="itens">A</div>
        <div class="itens">texto grande</div>
        <div class="itens">C</div>
        <div class="itens">texto maior ainda</div>
        <div class="itens">E</div>
        <div class="itens">texto muito giganstesco</div>
    </div>
</body>

</html>
