<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex box</title>
    <style>
        div.conteiner {
            background-color: brown;
            padding: 5px;

            display: flex;
            gap: 3px;
            flex-flow: row nowrap;

        }

        div.itens {
            border-radius: 5px;
            background-color: aqua;
            text-align: center;
            border: 1px solid black;
            padding: 50px 0;
            flex-basis: 200px;

        }

        div#i1 {
            flex-grow: 0;
            flex-shrink: 0;
        }

        div#i2 {
            flex-grow: 1;
            flex-shrink: 1;
        }

        div#i3 {
            flex-grow: 2;
            flex-shrink: 2;
        }
    </style>
</head>

<body>
    <div class="conteiner">
        <div class="itens" id="i1">A</div>
        <div class="itens" id="i2">B</div>
        <div class="itens" id="i3">C</div>
    </div>
</body>

</html>
