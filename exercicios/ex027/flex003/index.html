<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex box</title>
    <style>
        div.conteiner {
            
            
            background-color: brown;
            display: flex;
            flex-flow: row wrap;
            
            
        }

        div.itens {
            
            background-color: aqua;
            text-align: center;
            padding: 5px;
            border: 1px solid black;
            
            
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="itens">Bloco do item A</div>
        <div class="itens">Bloco do item B</div>
        <div class="itens">Bloco do item C</div>
        <div class="itens">Bloco do item D</div>
        <div class="itens">Bloco do item E</div>
        <div class="itens">Bloco do item F</div>
    </div>
</body>
</html>
